<main id="main" class="wrap">
  <section class="hero" style="padding-bottom:24px">
    <p class="eyebrow">任务控制台 · 演示</p>
    <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">你写任务，我们定范围，证据换付款。</h1>
    <p class="lede">像跟同事说话那样写下任务。计划器把它变成一份范围，从示例网络中挑选执行者，把托管款拆成里程碑，然后等待证据。<strong>这份演示是你浏览器里的脚本：不调用模型，不联网，不派出任何人。</strong></p>
  </section>

  <div class="mc">
    <div class="panel" aria-labelledby="brief-title">
      <h2 id="brief-title">任务说明</h2>
      <label for="company">客户账户</label>
      <input id="company" name="company" type="text" value="Northwind Robotics" autocomplete="off" spellcheck="false">
      <label for="brief">要发生什么</label>
      <textarea id="brief" name="brief"></textarea>
      <div class="chips" id="chips" aria-label="示例"></div>
      <div class="row">
        <div>
          <label for="city">城市</label>
          <select id="city"></select>
        </div>
        <div>
          <label for="budget">托管金额（美元）</label>
          <input id="budget" name="budget" type="number" min="50" step="50" value="900">
        </div>
      </div>
      <div class="btns" style="margin-top:16px">
        <button class="btn primary" id="plan" type="button">定义任务</button>
        <button class="btn" id="reset" type="button">重置</button>
      </div>
      <p class="small muted" id="form-note" style="margin-top:12px"></p>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist" aria-label="视图">
        <button role="tab" id="tab-plan" aria-controls="view" aria-selected="true" type="button">任务</button>
        <button role="tab" id="tab-pipe" aria-controls="view" aria-selected="false" type="button">管道</button>
        <button role="tab" id="tab-acc" aria-controls="view" aria-selected="false" type="button">账户</button>
      </div>
      <div id="view" role="tabpanel"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../app/app.js"></script>
</body>
</html>
